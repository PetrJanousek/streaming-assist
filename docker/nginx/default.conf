# Gateway in front of N api replicas.
#
# Docker DNS (127.0.0.11) returns every replica IP for the `api` name.
# A static `proxy_pass http://api:8000` would cache the first lookup and
# pin all traffic to one replica. Variable proxy_pass + resolver forces
# a lookup on every request so `--scale api=3` actually round-robins.
#
# valid=1s: Docker's DNS rotates A records; a long TTL would hide that.

map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
}

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=1s ipv6=off;

    # HARD_TIMEOUT_MS is 8s; SSE frames (T25) can sit on the socket longer.
    proxy_connect_timeout 2s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Connection "";

    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $req_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;

    add_header X-Request-Id $req_id always;
    add_header X-Upstream-Addr $upstream_addr always;

    location / {
        set $upstream http://api:8000;
        proxy_pass $upstream;
    }
}
